<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal Custom Embroidery Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Development Builds) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Compiler for Browser JSX Support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom scrollbar styling for a cleaner look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const API_URL = '/api/quotes';
    const API_CUSTOMERS_URL = '/api/customers';

    // Safe UUID Generator Fallback for local files
    function generateUUID() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return 'idx-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now();
    }

    // Lucide Icon Wrapper Component for HTML/CDN runtime
    function Icon({ name, size = 18, className = "" }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);

      return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
    }

    const LS_KEYS = {
      customers: 'crystal-portal-customers',
      quotes: 'crystal-portal-quotes',
      settings: 'crystal-portal-settings',
    };

    const defaultCustomers = [
      {
        id: generateUUID(),
        name: 'John Smith',
        company: 'Smith Maintenance',
        email: 'john@example.com',
        phone: '07123 456789',
        type: 'Retail',
        discountPct: 0,
        notes: 'Prefers WhatsApp updates.',
      },
      {
        id: generateUUID(),
        name: 'ABC Workwear',
        company: 'ABC Workwear Ltd',
        email: 'orders@abcworkwear.co.uk',
        phone: '01632 960001',
        type: 'Trade',
        discountPct: 10,
        notes: 'Weekly repeat orders.',
      },
    ];

    const defaultSettings = {
      printableWidthMm: 327,
      filmWidthMm: 390,
      minimumBillableLengthMm: 200,
      minimumCharge: 5,
      pricePerAdditional100Mm: 1,
      vatRate: 0.2,
    };

    function money(value) {
      return new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' }).format(value || 0);
    }

    function calculateUnitPrice(lengthMm, settings) {
      const parsedLength = Number(lengthMm) || 0;
      const effectiveLength = Math.max(parsedLength, settings.minimumBillableLengthMm);
      const extraBands = Math.max(0, (effectiveLength - settings.minimumBillableLengthMm) / 100);
      return settings.minimumCharge + extraBands * settings.pricePerAdditional100Mm;
    }

    function makeQuoteNumber(index) {
      return `Q-${String(index + 1).padStart(4, '0')}`;
    }

    function Card({ title, children, actions }) {
      return (
        <div className="rounded-3xl border border-slate-200 bg-white/90 p-5 shadow-sm backdrop-blur">
          {(title || actions) && (
            <div className="mb-4 flex items-start justify-between gap-3">
              {title && <h2 className="text-lg font-semibold text-slate-900">{title}</h2>}
              {actions}
            </div>
          )}
          {children}
        </div>
      );
    }

    function Badge({ children, tone = 'slate' }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-700',
        green: 'bg-emerald-100 text-emerald-700',
        blue: 'bg-sky-100 text-sky-700',
        amber: 'bg-amber-100 text-amber-700',
        purple: 'bg-purple-100 text-purple-700',
      };
      return <span className={`inline-flex rounded-full px-3 py-1 text-xs font-medium ${tones[tone]}`}>{children}</span>;
    }

    function CrystalCustomEmbroideryPortal() {
      const [tab, setTab] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [customers, setCustomers] = useState(defaultCustomers);
      const [quotes, setQuotes] = useState([]);
      const [settings, setSettings] = useState(defaultSettings);
      const [search, setSearch] = useState('');
      const [syncing, setSyncing] = useState(false);
      const [customerSyncing, setCustomerSyncing] = useState(false);

      const [customerForm, setCustomerForm] = useState({
        name: '',
        company: '',
        email: '',
        phone: '',
        type: 'Retail',
        discountPct: 0,
        notes: '',
      });

      const [quoteForm, setQuoteForm] = useState({
        customerId: '',
        lengthMm: '200',
        quantity: '1',
        vat: true,
        notes: '',
        status: 'Draft',
      });

      const [editingCustomerId, setEditingCustomerId] = useState(null);

      // Load Quotes directly from Cloudflare D1 API on startup
      async function fetchCloudQuotes() {
        try {
          const res = await fetch(API_URL);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              const formatted = data.map(q => ({
                id: q.id,
                quoteNumber: q.quote_number || q.id,
                customerName: q.customer_name,
                lengthMm: Number(q.length_mm),
                quantity: Number(q.quantity),
                unitPrice: Number(q.unit_price),
                subtotal: Number(q.subtotal),
                vatAmount: Number(q.vat_amount),
                total: Number(q.total),
                status: q.status,
                createdAt: q.created_at || new Date().toISOString()
              }));
              setQuotes(formatted);
              return;
            }
          }
        } catch (e) {
          console.warn('Database unreachable, falling back to LocalStorage', e);
        }

        // Fallback to local storage if API is not set up
        try {
          const rawQuotes = localStorage.getItem(LS_KEYS.quotes);
          if (rawQuotes) setQuotes(JSON.parse(rawQuotes));
        } catch (e) {}
      }

      // Load Customers directly from Cloudflare D1 API on startup
      async function fetchCloudCustomers() {
        try {
          const res = await fetch(API_CUSTOMERS_URL);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              const formatted = data.map(c => ({
                id: c.id,
                name: c.name,
                company: c.company || '',
                email: c.email || '',
                phone: c.phone || '',
                type: c.type || 'Retail',
                discountPct: Number(c.discount_pct) || 0,
                notes: c.notes || '',
              }));
              setCustomers(formatted);
              return;
            }
          }
        } catch (e) {
          console.warn('Customer database unreachable, falling back to LocalStorage', e);
        }

        // Fallback to local storage if API is not set up
        try {
          const rawCustomers = localStorage.getItem(LS_KEYS.customers);
          if (rawCustomers) setCustomers(JSON.parse(rawCustomers));
        } catch (e) {}
      }

      useEffect(() => {
        fetchCloudQuotes();
        fetchCloudCustomers();
        try {
          const rawSettings = localStorage.getItem(LS_KEYS.settings);
          if (rawSettings) setSettings(JSON.parse(rawSettings));
        } catch (e) {}
      }, []);

      useEffect(() => {
        if (customers.length > 0 && !quoteForm.customerId) {
          setQuoteForm(prev => ({ ...prev, customerId: customers[0].id }));
        }
      }, [customers]);

      useEffect(() => {
        localStorage.setItem(LS_KEYS.customers, JSON.stringify(customers));
      }, [customers]);

      useEffect(() => {
        localStorage.setItem(LS_KEYS.settings, JSON.stringify(settings));
      }, [settings]);

      const selectedCustomer = customers.find((c) => c.id === quoteForm.customerId) || customers[0];

      const parsedLength = Number(quoteForm.lengthMm) || 0;
      const parsedQty = Math.max(1, Number(quoteForm.quantity) || 1);

      const unitPriceBeforeDiscount = useMemo(() => calculateUnitPrice(parsedLength, settings), [parsedLength, settings]);
      const discountMultiplier = selectedCustomer ? 1 - selectedCustomer.discountPct / 100 : 1;
      const unitPrice = unitPriceBeforeDiscount * discountMultiplier;
      const subtotal = unitPrice * parsedQty;
      const vatAmount = quoteForm.vat ? subtotal * settings.vatRate : 0;
      const total = subtotal + vatAmount;

      // SAVE CUSTOMER DIRECTLY TO CLOUDFLARE DATABASE
      async function handleAddCustomer() {
        if (!customerForm.name.trim()) return;

        const payload = {
          id: editingCustomerId || generateUUID(),
          name: customerForm.name,
          company: customerForm.company,
          email: customerForm.email,
          phone: customerForm.phone,
          type: customerForm.type,
          discount_pct: customerForm.discountPct,
          notes: customerForm.notes,
        };

        try {
          await fetch(API_CUSTOMERS_URL, {
            method: editingCustomerId ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
        } catch (e) {
          console.error('Failed cloud save, relying on UI update', e);
        }

        await fetchCloudCustomers();
        setEditingCustomerId(null);
        setCustomerForm({
          name: '',
          company: '',
          email: '',
          phone: '',
          type: 'Retail',
          discountPct: 0,
          notes: '',
        });
        setTab('customers');
      }

      function startEditCustomer(customer) {
        setEditingCustomerId(customer.id);
        setCustomerForm({
          name: customer.name,
          company: customer.company,
          email: customer.email,
          phone: customer.phone,
          type: customer.type,
          discountPct: customer.discountPct,
          notes: customer.notes,
        });
        setTab('customers');
      }

      async function deleteCustomer(id) {
        try {
          await fetch(API_CUSTOMERS_URL, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id }),
          });
        } catch (e) {
          console.error('Failed cloud delete', e);
        }
        await fetchCloudCustomers();
      }

      function updateQuoteStatus(quoteId, newStatus) {
        setQuotes((prev) =>
          prev.map((q) => (q.id === quoteId ? { ...q, status: newStatus } : q))
        );
      }

      // SAVE QUOTE DIRECTLY TO CLOUDFLARE DATABASE
      async function saveQuote() {
        const customer = customers.find((c) => c.id === quoteForm.customerId) || customers[0];
        if (!customer) return;

        const finalLength = Math.max(parsedLength, settings.minimumBillableLengthMm);
        const qNum = makeQuoteNumber(quotes.length);

        const newQuotePayload = {
          id: generateUUID(),
          quote_number: qNum,
          customer_name: customer.name,
          length_mm: finalLength,
          quantity: parsedQty,
          unit_price: unitPrice,
          subtotal: subtotal,
          vat_amount: vatAmount,
          total: total,
          status: quoteForm.status,
          source: 'Portal'
        };

        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newQuotePayload)
          });
        } catch (e) {
          console.error("Failed cloud save, relying on UI update", e);
        }

        await fetchCloudQuotes();
        setTab('quotes');
      }

      // ONE-CLICK PORTING OF ALL LOCAL QUOTES TO CLOUDFLARE D1
      async function portLocalQuotesToCloud() {
        setSyncing(true);
        const localQuotes = JSON.parse(localStorage.getItem(LS_KEYS.quotes) || '[]');
        for (const q of localQuotes) {
          try {
            await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: q.id || generateUUID(),
                quote_number: q.quoteNumber,
                customer_name: q.customerName,
                length_mm: q.lengthMm,
                quantity: q.quantity,
                unit_price: q.unitPrice,
                subtotal: q.subtotal,
                vat_amount: q.vatAmount,
                total: q.total,
                status: q.status,
                source: 'Portal'
              })
            });
          } catch (e) {}
        }
        await fetchCloudQuotes();
        setSyncing(false);
        alert('All local quotes successfully uploaded to Cloudflare Database!');
      }

      // ONE-CLICK PORTING OF ALL LOCAL CUSTOMERS TO CLOUDFLARE D1
      async function portLocalCustomersToCloud() {
        setCustomerSyncing(true);
        const rawLocal = localStorage.getItem(LS_KEYS.customers);
        const localCustomers = rawLocal ? JSON.parse(rawLocal) : customers;
        for (const c of localCustomers) {
          try {
            await fetch(API_CUSTOMERS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: c.id || generateUUID(),
                name: c.name,
                company: c.company,
                email: c.email,
                phone: c.phone,
                type: c.type,
                discount_pct: c.discountPct,
                notes: c.notes,
              })
            });
          } catch (e) {}
        }
        await fetchCloudCustomers();
        setCustomerSyncing(false);
        alert('All local customers successfully uploaded to Cloudflare Database!');
      }

      function printQuote(quote) {
        const printWindow = window.open('', '_blank', 'width=900,height=1200');
        if (!printWindow) return;

        printWindow.document.write(`
          <html>
            <head>
              <title>${quote.quoteNumber}</title>
              <style>
                body { font-family: Arial, sans-serif; padding: 32px; color: #0f172a; }
                h1 { margin: 0 0 8px; }
                .muted { color: #64748b; }
                .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
                .card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; }
                table { width: 100%; border-collapse: collapse; margin-top: 24px; }
                td { padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
                td:last-child { text-align: right; font-weight: 600; }
                .total { font-size: 1.2rem; }
              </style>
            </head>
            <body>
              <h1>Crystal Custom Embroidery</h1>
              <div class="muted">DTF Quote • ${quote.quoteNumber}</div>
              <div class="grid">
                <div class="card">
                  <strong>Customer</strong><br/>
                  ${quote.customerName}
                </div>
                <div class="card">
                  <strong>Quote details</strong><br/>
                  Length: ${quote.lengthMm} mm<br/>
                  Quantity: ${quote.quantity}<br/>
                  VAT: ${quote.vat ? 'Yes' : 'No'}<br/>
                  Status: ${quote.status}
                </div>
              </div>
              <table>
                <tr><td>Unit price</td><td>${money(quote.unitPrice)}</td></tr>
                <tr><td>Subtotal</td><td>${money(quote.subtotal)}</td></tr>
                <tr><td>VAT</td><td>${money(quote.vatAmount)}</td></tr>
                <tr><td class="total">Total</td><td class="total">${money(quote.total)}</td></tr>
              </table>
              <p class="muted" style="margin-top: 24px;">Generated ${new Date(quote.createdAt).toLocaleString('en-GB')}</p>
              <script>window.print();<\/script>
            </body>
          </html>
        `);
        printWindow.document.close();
      }

      const filteredCustomers = customers.filter((c) => {
        const q = search.trim().toLowerCase();
        if (!q) return true;
        return [c.name, c.company, c.email, c.phone, c.type, c.notes].some((v) => v.toLowerCase().includes(q));
      });

      const stats = useMemo(() => {
        const revenue = quotes.reduce((sum, q) => sum + q.total, 0);
        const totalLength = quotes.reduce((sum, q) => sum + q.lengthMm * q.quantity, 0);
        const openQuotes = quotes.filter((q) => q.status === 'Draft' || q.status === 'Sent').length;
        return { revenue, totalLength, openQuotes };
      }, [quotes]);

      const nav = [
        { id: 'dashboard', label: 'Dashboard', icon: 'home' },
        { id: 'quotes', label: 'Quotes', icon: 'clipboard-list' },
        { id: 'customers', label: 'Customers', icon: 'users' },
        { id: 'settings', label: 'Settings', icon: 'settings' },
      ];

      function getStatusTone(status) {
        switch (status) {
          case 'Completed': return 'green';
          case 'Approved': return 'blue';
          case 'Printing': return 'amber';
          case 'Sent': return 'purple';
          default: return 'slate';
        }
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100">
          <div className="mx-auto flex min-h-screen max-w-7xl">
            {/* Sidebar */}
            <aside className="hidden w-72 shrink-0 border-r border-white/10 bg-slate-950/80 p-6 lg:block">
              <div className="mb-8">
                <div className="text-xs uppercase tracking-[0.25em] text-sky-300">Crystal Custom Embroidery</div>
                <h1 className="mt-2 text-2xl font-semibold">Portal</h1>
                <p className="mt-2 text-sm text-slate-400">Quotes, customers, and pricing in one place.</p>
              </div>

              <nav className="space-y-2">
                {nav.map((item) => {
                  const active = tab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setTab(item.id)}
                      className={`flex w-full items-center gap-3 rounded-2xl px-4 py-3 text-left transition ${
                        active ? 'bg-sky-500 text-slate-950 font-semibold' : 'text-slate-300 hover:bg-white/5 hover:text-white'
                      }`}
                    >
                      <Icon name={item.icon} size={18} />
                      <span className="font-medium">{item.label}</span>
                    </button>
                  );
                })}
              </nav>

              <div className="mt-8 rounded-3xl border border-white/10 bg-white/5 p-4 text-sm text-slate-300 space-y-3">
                <div className="flex items-center gap-2 font-semibold text-white">
                  <Icon name="cloud" size={16} /> Cloud Database Ready
                </div>
                <button
                  onClick={portLocalQuotesToCloud}
                  disabled={syncing}
                  className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 transition"
                >
                  <Icon name="upload-cloud" size={14} />
                  {syncing ? 'Uploading...' : 'Port Local Quotes to Cloud'}
                </button>
                <button
                  onClick={portLocalCustomersToCloud}
                  disabled={customerSyncing}
                  className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 transition"
                >
                  <Icon name="upload-cloud" size={14} />
                  {customerSyncing ? 'Uploading...' : 'Port Local Customers to Cloud'}
                </button>
              </div>
            </aside>

            {/* Main Area */}
            <main className="flex-1 p-4 lg:p-8">
              {/* Mobile Header */}
              <div className="mb-6 flex items-center justify-between gap-3 rounded-3xl border border-white/10 bg-white/5 px-4 py-3 backdrop-blur lg:hidden">
                <button onClick={() => setMobileMenuOpen((v) => !v)} className="inline-flex items-center gap-2 rounded-xl bg-white/10 px-3 py-2 text-sm font-medium">
                  <Icon name="menu" size={16} /> Menu
                </button>
                <div className="text-sm font-semibold">Crystal Portal</div>
              </div>

              {mobileMenuOpen && (
                <div className="mb-4 rounded-3xl border border-white/10 bg-slate-900 p-3 lg:hidden">
                  <div className="grid grid-cols-2 gap-2">
                    {nav.map((item) => (
                      <button key={item.id} onClick={() => { setTab(item.id); setMobileMenuOpen(false); }} className="flex items-center gap-2 rounded-2xl bg-white/5 px-3 py-3 text-sm">
                        <Icon name={item.icon} size={16} /> {item.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Dashboard Tab */}
              {tab === 'dashboard' && (
                <div className="space-y-6">
                  <section className="grid gap-4 md:grid-cols-3">
                    <Card title="Revenue">
                      <div className="text-3xl font-semibold text-white">{money(stats.revenue)}</div>
                      <p className="mt-2 text-sm text-slate-400">Total from saved quotes</p>
                    </Card>
                    <Card title="Open Quotes">
                      <div className="text-3xl font-semibold text-white">{stats.openQuotes}</div>
                      <p className="mt-2 text-sm text-slate-400">Draft and sent quotes</p>
                    </Card>
                    <Card title="Film Used">
                      <div className="text-3xl font-semibold text-white">{stats.totalLength.toLocaleString('en-GB')} mm</div>
                      <p className="mt-2 text-sm text-slate-400">Across all saved quotes</p>
                    </Card>
                  </section>

                  <section className="grid gap-6 lg:grid-cols-2">
                    <Card title="Quick Quote" actions={<Badge tone="blue">Live pricing</Badge>}>
                      <div className="grid gap-4 md:grid-cols-2">
                        <label className="space-y-2 text-sm">
                          <span className="text-slate-700 font-medium">Customer</span>
                          <select className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={quoteForm.customerId} onChange={(e) => setQuoteForm({ ...quoteForm, customerId: e.target.value })}>
                            {customers.map((c) => (
                              <option key={c.id} value={c.id}>{c.name} {c.type === 'Trade' ? '• Trade' : ''}</option>
                            ))}
                          </select>
                        </label>
                        <label className="space-y-2 text-sm">
                          <span className="text-slate-700 font-medium">Length (mm)</span>
                          <input 
                            className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" 
                            type="number" 
                            value={quoteForm.lengthMm} 
                            onChange={(e) => setQuoteForm({ ...quoteForm, lengthMm: e.target.value })} 
                            onBlur={() => {
                              if (!quoteForm.lengthMm || Number(quoteForm.lengthMm) < settings.minimumBillableLengthMm) {
                                setQuoteForm(prev => ({ ...prev, lengthMm: String(settings.minimumBillableLengthMm) }));
                              }
                            }}
                          />
                        </label>
                        <label className="space-y-2 text-sm">
                          <span className="text-slate-700 font-medium">Quantity</span>
                          <input 
                            className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" 
                            type="number" 
                            value={quoteForm.quantity} 
                            onChange={(e) => setQuoteForm({ ...quoteForm, quantity: e.target.value })} 
                            onBlur={() => {
                              if (!quoteForm.quantity || Number(quoteForm.quantity) < 1) {
                                setQuoteForm(prev => ({ ...prev, quantity: '1' }));
                              }
                            }}
                          />
                        </label>
                        <label className="space-y-2 text-sm">
                          <span className="text-slate-700 font-medium">VAT</span>
                          <select className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={quoteForm.vat ? 'Yes' : 'No'} onChange={(e) => setQuoteForm({ ...quoteForm, vat: e.target.value === 'Yes' })}>
                            <option>Yes</option>
                            <option>No</option>
                          </select>
                        </label>
                        <label className="space-y-2 text-sm md:col-span-2">
                          <span className="text-slate-700 font-medium">Initial Status</span>
                          <select className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={quoteForm.status} onChange={(e) => setQuoteForm({ ...quoteForm, status: e.target.value })}>
                            <option value="Draft">Draft</option>
                            <option value="Sent">Sent</option>
                            <option value="Approved">Approved</option>
                            <option value="Printing">Printing</option>
                            <option value="Completed">Completed</option>
                          </select>
                        </label>
                      </div>

                      <label className="mt-4 block space-y-2 text-sm">
                        <span className="text-slate-700 font-medium">Notes</span>
                        <textarea className="min-h-24 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={quoteForm.notes} onChange={(e) => setQuoteForm({ ...quoteForm, notes: e.target.value })} placeholder="Artwork notes, turnaround, special instructions..." />
                      </label>

                      <div className="mt-4 grid gap-3 rounded-3xl bg-slate-100 p-4 text-slate-900 md:grid-cols-2">
                        <div>
                          <div className="text-xs font-medium uppercase tracking-wide text-slate-500">Unit price</div>
                          <div className="mt-1 text-2xl font-semibold">{money(unitPrice)}</div>
                          {selectedCustomer?.discountPct ? <div className="mt-1 text-sm text-slate-500">Includes {selectedCustomer.discountPct}% trade discount</div> : null}
                        </div>
                        <div>
                          <div className="text-xs font-medium uppercase tracking-wide text-slate-500">Total</div>
                          <div className="mt-1 text-2xl font-semibold">{money(total)}</div>
                          <div className="mt-1 text-sm text-slate-500">Subtotal {money(subtotal)} • VAT {money(vatAmount)}</div>
                        </div>
                      </div>

                      <div className="mt-4 flex flex-wrap gap-3">
                        <button onClick={saveQuote} className="inline-flex items-center gap-2 rounded-2xl bg-sky-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-sky-400">
                          <Icon name="save" size={16} /> Save Quote
                        </button>
                        <button onClick={() => setTab('quotes')} className="inline-flex items-center gap-2 rounded-2xl border border-slate-300 bg-slate-100 px-4 py-3 font-semibold text-slate-800 transition hover:bg-slate-200">
                          <Icon name="clipboard-list" size={16} /> View Quotes
                        </button>
                      </div>
                    </Card>

                    <Card title="Recent Quotes" actions={<Badge>Cloud Database</Badge>}>
                      <div className="space-y-3">
                        {quotes.slice(0, 5).map((quote) => (
                          <div key={quote.id} className="rounded-2xl border border-slate-200 bg-white p-4 text-slate-900">
                            <div className="flex items-start justify-between gap-3">
                              <div>
                                <div className="font-semibold">{quote.quoteNumber} • {quote.customerName}</div>
                                <div className="mt-1 text-sm text-slate-500">{quote.lengthMm} mm × {quote.quantity}</div>
                              </div>
                              <Badge tone={getStatusTone(quote.status)}>{quote.status}</Badge>
                            </div>
                            <div className="mt-3 flex items-center justify-between text-sm">
                              <span className="text-slate-500">Total</span>
                              <span className="font-semibold">{money(quote.total)}</span>
                            </div>
                          </div>
                        ))}
                        {!quotes.length && <div className="rounded-2xl border border-dashed border-slate-300 p-6 text-center text-slate-500">No quotes yet. Save your first one and it’ll appear here.</div>}
                      </div>
                    </Card>
                  </section>
                </div>
              )}

              {/* Quotes Tab */}
              {tab === 'quotes' && (
                <div className="space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h2 className="text-2xl font-semibold text-white">Quotes</h2>
                      <p className="text-slate-400">Create, review, and print customer quotes.</p>
                    </div>
                    <button onClick={() => setTab('dashboard')} className="inline-flex items-center gap-2 rounded-2xl bg-sky-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-sky-400">
                      <Icon name="calculator" size={16} /> Quick Quote
                    </button>
                  </div>

                  <Card>
                    <div className="overflow-x-auto rounded-2xl border border-slate-200 bg-white text-slate-900">
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 text-slate-500">
                          <tr>
                            <th className="px-4 py-3">Quote</th>
                            <th className="px-4 py-3">Customer</th>
                            <th className="px-4 py-3">Length</th>
                            <th className="px-4 py-3">Total</th>
                            <th className="px-4 py-3">Status</th>
                            <th className="px-4 py-3">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          {quotes.map((quote) => (
                            <tr key={quote.id} className="border-t border-slate-100">
                              <td className="px-4 py-3 font-medium">{quote.quoteNumber}</td>
                              <td className="px-4 py-3">{quote.customerName}</td>
                              <td className="px-4 py-3">{quote.lengthMm} mm × {quote.quantity}</td>
                              <td className="px-4 py-3 font-semibold">{money(quote.total)}</td>
                              <td className="px-4 py-3">
                                <select 
                                  value={quote.status} 
                                  onChange={(e) => updateQuoteStatus(quote.id, e.target.value)}
                                  className="rounded-xl border border-slate-300 bg-slate-50 px-2 py-1 text-xs font-semibold text-slate-800 focus:bg-white focus:outline-none"
                                >
                                  <option value="Draft">Draft</option>
                                  <option value="Sent">Sent</option>
                                  <option value="Approved">Approved</option>
                                  <option value="Printing">Printing</option>
                                  <option value="Completed">Completed</option>
                                </select>
                              </td>
                              <td className="px-4 py-3">
                                <button onClick={() => printQuote(quote)} className="inline-flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 font-medium hover:bg-slate-50">
                                  <Icon name="printer" size={16} /> Print
                                </button>
                              </td>
                            </tr>
                          ))}
                          {!quotes.length && (
                            <tr>
                              <td className="px-4 py-10 text-center text-slate-500" colSpan={6}>No quotes saved yet.</td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </Card>
                </div>
              )}

              {/* Customers Tab */}
              {tab === 'customers' && (
                <div className="space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h2 className="text-2xl font-semibold text-white">Customers</h2>
                      <p className="text-slate-400">Store contacts, trade status, and notes.</p>
                    </div>
                    <button onClick={() => setEditingCustomerId(null)} className="inline-flex items-center gap-2 rounded-2xl bg-sky-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-sky-400">
                      <Icon name="plus" size={16} /> New Customer
                    </button>
                  </div>

                  <Card title={editingCustomerId ? 'Edit Customer' : 'Add Customer'}>
                    <div className="grid gap-4 md:grid-cols-2">
                      <label className="space-y-2 text-sm">
                        <span className="text-slate-700 font-medium">Name</span>
                        <input className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={customerForm.name} onChange={(e) => setCustomerForm({ ...customerForm, name: e.target.value })} />
                      </label>
                      <label className="space-y-2 text-sm">
                        <span className="text-slate-700 font-medium">Company</span>
                        <input className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={customerForm.company} onChange={(e) => setCustomerForm({ ...customerForm, company: e.target.value })} />
                      </label>
                      <label className="space-y-2 text-sm">
                        <span className="text-slate-700 font-medium">Email</span>
                        <input className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={customerForm.email} onChange={(e) => setCustomerForm({ ...customerForm, email: e.target.value })} />
                      </label>
                      <label className="space-y-2 text-sm">
                        <span className="text-slate-700 font-medium">Phone</span>
                        <input className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={customerForm.phone} onChange={(e) => setCustomerForm({ ...customerForm, phone: e.target.value })} />
                      </label>
                      <label className="space-y-2 text-sm">
                        <span className="text-slate-700 font-medium">Type</span>
                        <select className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={customerForm.type} onChange={(e) => setCustomerForm({ ...customerForm, type: e.target.value })}>
                          <option>Retail</option>
                          <option>Trade</option>
                        </select>
                      </label>
                      <label className="space-y-2 text-sm">
                        <span className="text-slate-700 font-medium">Discount %</span>
                        <input className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" type="number" min={0} max={100} value={customerForm.discountPct} onChange={(e) => setCustomerForm({ ...customerForm, discountPct: Math.max(0, Number(e.target.value) || 0) })} />
                      </label>
                    </div>
                    <label className="mt-4 block space-y-2 text-sm">
                      <span className="text-slate-700 font-medium">Notes</span>
                      <textarea className="min-h-24 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900" value={customerForm.notes} onChange={(e) => setCustomerForm({ ...customerForm, notes: e.target.value })} />
                    </label>
                    <div className="mt-4 flex gap-3">
                      <button onClick={handleAddCustomer} className="inline-flex items-center gap-2 rounded-2xl bg-sky-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-sky-400">
                        <Icon name="save" size={16} /> {editingCustomerId ? 'Update Customer' : 'Save Customer'}
                      </button>
                      <button onClick={() => setCustomerForm({ name: '', company: '', email: '', phone: '', type: 'Retail', discountPct: 0, notes: '' })} className="inline-flex items-center gap-2 rounded-2xl border border-slate-300 bg-slate-100 px-4 py-3 font-semibold text-slate-800 transition hover:bg-slate-200">
                        <Icon name="x" size={16} /> Clear
                      </button>
                    </div>
                  </Card>

                  <Card title="Saved Customers" actions={<div className="relative"><Icon name="search" size={16} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" /><input className="rounded-2xl border border-slate-200 bg-white py-2 pl-9 pr-3 text-slate-900" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search customers" /></div>}>
                    <div className="grid gap-4 lg:grid-cols-2">
                      {filteredCustomers.map((customer) => (
                        <div key={customer.id} className="rounded-3xl border border-slate-200 bg-white p-5 text-slate-900">
                          <div className="flex items-start justify-between gap-3">
                            <div>
                              <div className="text-lg font-semibold">{customer.name}</div>
                              <div className="text-sm text-slate-500">{customer.company || 'No company'} • {customer.type}</div>
                            </div>
                            <Badge tone={customer.type === 'Trade' ? 'green' : 'slate'}>{customer.discountPct ? `${customer.discountPct}% off` : 'Standard'}</Badge>
                          </div>
                          <div className="mt-4 space-y-1 text-sm text-slate-600">
                            <div>{customer.email || 'No email'}</div>
                            <div>{customer.phone || 'No phone'}</div>
                            {customer.notes ? <div className="pt-2 text-slate-500">{customer.notes}</div> : null}
                          </div>
                          <div className="mt-4 flex gap-2">
                            <button onClick={() => startEditCustomer(customer)} className="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium hover:bg-slate-50">Edit</button>
                            <button onClick={() => deleteCustomer(customer.id)} className="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-rose-600 hover:bg-rose-50">Delete</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </Card>
                </div>
              )}

              {/* Settings Tab */}
              {tab === 'settings' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-semibold text-white">Settings</h2>
                    <p className="text-slate-400">Adjust pricing and machine values without changing code.</p>
                  </div>
                  <Card title="Pricing & Machine Settings">
                    <div className="grid gap-4 md:grid-cols-2">
                      {[
                        ['Printable width (mm)', 'printableWidthMm'],
                        ['Film width (mm)', 'filmWidthMm'],
                        ['Minimum billable length (mm)', 'minimumBillableLengthMm'],
                        ['Minimum charge (£)', 'minimumCharge'],
                        ['Price per additional 100 mm (£)', 'pricePerAdditional100Mm'],
                        ['VAT rate', 'vatRate'],
                      ].map(([label, key]) => (
                        <label key={key} className="space-y-2 text-sm">
                          <span className="text-slate-700 font-medium">{label}</span>
                          <input
                            type="number"
                            step={key === 'vatRate' ? '0.01' : '1'}
                            className="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-900"
                            value={settings[key]}
                            onChange={(e) =>
                              setSettings((prev) => ({
                                ...prev,
                                [key]: Number(e.target.value),
                              }))
                            }
                          />
                        </label>
                      ))}
                    </div>
                  </Card>
                  <Card title="Current Quote Preview">
                    <div className="grid gap-4 md:grid-cols-3">
                      <div className="rounded-2xl bg-slate-50 p-4 text-slate-900"><div className="text-xs text-slate-500">Printable width</div><div className="mt-1 text-xl font-semibold">{settings.printableWidthMm} mm</div></div>
                      <div className="rounded-2xl bg-slate-50 p-4 text-slate-900"><div className="text-xs text-slate-500">Minimum length</div><div className="mt-1 text-xl font-semibold">{settings.minimumBillableLengthMm} mm</div></div>
                      <div className="rounded-2xl bg-slate-50 p-4 text-slate-900"><div className="text-xs text-slate-500">Minimum charge</div><div className="mt-1 text-xl font-semibold">{money(settings.minimumCharge)}</div></div>
                    </div>
                  </Card>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CrystalCustomEmbroideryPortal />);
  </script>
</body>
</html>
