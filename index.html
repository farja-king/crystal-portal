<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Embroidery - Quoting Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col justify-between">
      <div>
        <div class="mb-8">
          <p class="text-xs font-semibold tracking-widest text-sky-400 uppercase">Crystal Custom Embroidery</p>
          <h1 class="text-2xl font-bold text-white">Portal</h1>
          <p class="text-xs text-slate-400 mt-1">Quotes, customers, and pricing in one place.</p>
        </div>
        <nav class="space-y-2">
          <button class="w-full text-left px-4 py-2.5 rounded-lg bg-sky-500 text-white font-medium flex items-center gap-3">
            📋 Quotes
          </button>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h2 class="text-3xl font-bold text-white">Quotes</h2>
          <p class="text-slate-400 text-sm">Create, review, and print customer quotes.</p>
        </div>
        <button onclick="openModal()" class="bg-sky-500 hover:bg-sky-400 text-white font-semibold px-5 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transition">
          🧮 Quick Quote
        </button>
      </div>

      <!-- Quotes List Table -->
      <div class="bg-white text-slate-800 rounded-2xl shadow-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase tracking-wider">
              <th class="p-4">Quote</th>
              <th class="p-4">Customer</th>
              <th class="p-4">Length</th>
              <th class="p-4">Total</th>
              <th class="p-4">Status</th>
            </tr>
          </thead>
          <tbody id="portal-quotes-body" class="divide-y divide-slate-100 text-sm font-medium">
            <tr>
              <td colspan="5" class="p-8 text-center text-slate-400">Loading quotes from cloud database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Create Quote Modal -->
  <div id="quote-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 text-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-xl font-bold mb-4">Create New Quote</h3>
      <form id="quote-form" onsubmit="submitQuote(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Customer Name</label>
          <input type="text" id="cust-name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Length (mm)</label>
            <input type="number" id="length-mm" required value="100" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Quantity</label>
            <input type="number" id="quantity" required value="1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Unit Price (£)</label>
          <input type="number" step="0.01" id="unit-price" required value="25.00" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm bg-slate-800 text-slate-300 hover:bg-slate-700">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm bg-sky-500 text-white font-semibold hover:bg-sky-400">Save Quote</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = '/api/quotes';

    function openModal() { document.getElementById('quote-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('quote-modal').classList.add('hidden'); }

    // Fetch quotes from D1 database
    async function loadPortalQuotes() {
      const tbody = document.getElementById('portal-quotes-body');
      try {
        const res = await fetch(API_URL);
        const quotes = await res.json();
        if (!quotes || quotes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">No quotes found in cloud database.</td></tr>';
          return;
        }
        tbody.innerHTML = quotes.map(q => `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-4 text-slate-900 font-bold">${q.quote_number || q.id}</td>
            <td class="p-4 text-slate-700">${q.customer_name}</td>
            <td class="p-4 text-slate-500">${q.length_mm} mm × ${q.quantity}</td>
            <td class="p-4 text-slate-900 font-bold">£${Number(q.total).toFixed(2)}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-amber-100 text-amber-800">
                ${q.status}
              </span>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Error: ${err.message}</td></tr>`;
      }
    }

    // Submit new quote to D1 database
    async function submitQuote(e) {
      e.preventDefault();
      const name = document.getElementById('cust-name').value;
      const length = parseFloat(document.getElementById('length-mm').value);
      const qty = parseInt(document.getElementById('quantity').value);
      const price = parseFloat(document.getElementById('unit-price').value);

      const subtotal = length * qty * (price / 100);
      const vatAmount = subtotal * 0.20;
      const total = subtotal + vatAmount;

      const payload = {
        id: 'Q-' + Date.now().toString().slice(-4),
        quote_number: 'Q-' + Date.now().toString().slice(-4),
        customer_name: name,
        length_mm: length,
        quantity: qty,
        unit_price: price,
        subtotal: subtotal,
        vat_amount: vatAmount,
        total: total,
        status: 'Pending Approval',
        source: 'Customer Portal'
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        closeModal();
        document.getElementById('quote-form').reset();
        loadPortalQuotes();
      } catch (err) {
        alert('Error saving quote: ' + err.message);
      }
    }

    // Initial load
    loadPortalQuotes();
  </script>
</body>
</html>
